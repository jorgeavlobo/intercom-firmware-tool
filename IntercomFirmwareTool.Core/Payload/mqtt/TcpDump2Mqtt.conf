# TcpDump2Mqtt — configuration
#
# Bridges the BTicino OpenWebNet/SCS bus and physical keys to an MQTT broker.
# This file is *sourced* by POSIX sh (KEY=value, no spaces around "="), so a
# value can run shell if it contains metacharacters. It is generated by the
# installer and installed 0600 root:root on a read-only rootfs — treat it as a
# trusted, machine-written file, not a place for hand-pasted untrusted content.

# --- Broker -----------------------------------------------------------------
# Broker IP address (preferred) or hostname.
MQTT_HOST=
# Broker port. 1883 = plain, 8883 = TLS (set the MQTT_CAFILE group below for TLS).
MQTT_PORT=1883

# --- Authentication (recommended) -------------------------------------------
# Username/password. If MQTT_USER is set, MQTT_PASS must be set too.
MQTT_USER=
MQTT_PASS=

# --- TLS (recommended) ------------------------------------------------------
# MQTT_CAFILE alone: one-way TLS (encrypts the link and verifies the broker).
# Add BOTH MQTT_CERTFILE and MQTT_KEYFILE for mutual TLS (client-certificate
# authentication). Auth and TLS are independent — MQTT_USER may be combined with
# any TLS mode.
MQTT_CAFILE=
MQTT_CERTFILE=
MQTT_KEYFILE=

# --- Topics -----------------------------------------------------------------
# Commands received FROM an external system (e.g. Home Assistant).
TOPIC_RX=Bticino/rx
# Every OpenWebNet frame the unit emits is published here.
TOPIC_DUMP=Bticino/tx
# Service activation date/time.
TOPIC_STARTD=Bticino/start_date
# Online/offline state (retained birth message + MQTT last will).
TOPIC_LASTWILL=Bticino/LastWillT
# Physical key presses on the unit.
TOPIC_KEY=Bticino/key
# Replies from the (optional, gated) remote command channel below.
TOPIC_CMD_RESULT=Bticino/command_result_topic
TOPIC_FILE_CONTENT=Bticino/file_content_topic

# --- Remote command channel (DANGEROUS, off by default) ---------------------
# When 1, TOPIC_RX also accepts JSON commands read_file / write_file /
# execute_command, which grant root-equivalent control of the device over MQTT.
# Honoured ONLY when the CLIENT is authenticated: either MQTT_USER/MQTT_PASS, or
# mutual TLS (MQTT_CERTFILE + MQTT_KEYFILE). One-way TLS (CA only) verifies the
# broker but NOT the client, so it does NOT unlock this channel.
#
# IMPORTANT: these credentials authenticate THIS bridge to the broker; they do
# NOT prove that whoever PUBLISHED a command to TOPIC_RX is authorized. On a
# shared broker, anyone who can publish to TOPIC_RX would run these commands as
# root. Only enable this on a broker whose ACLs restrict publishing to TOPIC_RX
# to trusted clients. Leave at 0 unless you fully control the broker and network.
# Also: without TLS, the read_file/execute_command REPLIES cross the broker in
# cleartext — prefer TLS when using this channel.
ALLOW_REMOTE_SHELL=0
