# cargo-deny policy for btmqttd (issue #14), enforced in CI by .github/workflows/security.yml.
# Makes the shipped binary's supply-chain guarantees a GATE, not just documentation
# (THIRD_PARTY.md): the dependency tree must stay permissive-licensed (no copyleft) and
# free of known RustSec advisories.

[advisories]
# RustSec advisory DB. Under cargo-deny's v2 advisories schema (the default in the pinned
# action's cargo-deny 0.20.2) there are no per-class severity knobs: every class —
# vulnerability, unsound AND unmaintained — is deny-by-default, and acceptance is only via
# the `ignore` list below. (Confirmed in CI: the *unmaintained* rustls-pemfile advisory
# RUSTSEC-2025-0134 failed the job until it was added to `ignore` — i.e. unmaintained is an
# error here, unlike cargo-deny's old v1 schema where it defaulted to a warning.)
yanked = "deny"
# Documented, tracked exceptions (VEX-style). Every entry below is in the TLS stack that
# rumqttc 0.24 pulls transitively, and there is NO fix reachable today: the latest rumqttc
# (0.25.1) still pins rustls-webpki 0.102.8 and rustls-pemfile 2.2.0. Each is accepted with
# a per-advisory justification and tracked in #81 for removal the moment a compatible
# upgrade exists. btmqttd is a TLS *client* validating a single endpoint (the user's own
# MQTT broker) and does not use CRLs, so the real-world exposure is low. Keeping these
# scoped exceptions (rather than a red-forever gate) lets cargo-deny keep catching new,
# fixable issues. See #81 before adding or removing entries here.
ignore = [
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL distributionPoint matching; btmqttd does not use CRLs and exploit needs a compromised issuing CA. No fix reachable via rumqttc. Tracked in #81." },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name-constraint accepted; reachable only after signature verification and requires cert misissuance; btmqttd validates only its own broker. No fix reachable. Tracked in #81." },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name-constraint; same class as 0098 (post-verify, misissuance-gated). No fix reachable. Tracked in #81." },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki panic parsing CRLs; btmqttd does not use CRLs, so unreachable. No fix reachable. Tracked in #81." },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained (not a vulnerability): no patched release exists; RustSec recommends migrating to rustls-pki-types::pem::PemObject, but the crate is pulled transitively by rumqttc, so that awaits the rumqttc/rustls bump. Tracked in #81." },
]

[licenses]
# Permissive-only allow-list, matching the licenses actually present in the dependency
# graph today (all of MIT / Apache-2.0 / ISC / BSD-3-Clause / Unicode-3.0; the couple of
# `... OR MIT` / `... OR Apache-2.0` crates resolve here too). Anything outside this set —
# notably any copyleft (GPL / LGPL / MPL / AGPL) — fails the check. This is the automated
# enforcement of the "no copyleft" claim in THIRD_PARTY.md.
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
# Non-fatal hygiene signals (surfaced, not enforced).
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Crates must come from crates.io (or the workspace); an unknown registry or a git
# dependency fails — no unvetted sources sneak into the shipped binary.
unknown-registry = "deny"
unknown-git = "deny"
