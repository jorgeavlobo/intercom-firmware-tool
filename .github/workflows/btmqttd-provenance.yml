name: btmqttd binary provenance

# On any PR that touches the daemon (or its committed binary / metadata), guard the
# binary-in-repo against drift (issue #72) in two tiers, both FATAL:
#   - metadata: the committed binary's SHA-256 + size must match PayloadBinaries.cs and
#     THIRD_PARTY.md (deterministic — catches a binary or metadata updated without the
#     other).
#   - reproduction: rebuild from source and require a byte-for-byte match with the
#     committed binary. This is enforceable because every build input is pinned — rustc
#     via rust-toolchain.toml, crates via Cargo.lock, and the one C input (ring's armhf
#     cross-gcc) via an immutable Ubuntu archive snapshot (issue #76). A distro gcc bump
#     can no longer silently change the object code, so a mismatch means the vendored
#     binary is out of sync with native/btmqttd/ source.

on:
  pull_request:
    paths:
      - 'native/btmqttd/**'
      - 'IntercomFirmwareTool.Core/Payload/vendor/armhf/btmqttd'
      - 'IntercomFirmwareTool.Core/Payload/PayloadBinaries.cs'
      - 'IntercomFirmwareTool.Core/Payload/vendor/THIRD_PARTY.md'
      - '.github/workflows/btmqttd-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    # ubuntu-24.04 so the snapshot-pinned "noble" cross-gcc installs cleanly (matching apt
    # generation / keyring). The cross-gcc *version* is pinned to an immutable Ubuntu
    # archive snapshot in the install step below, so the reproducible SHA no longer depends
    # on this runner image's rolling package set. See BUILD.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # This job only reads the repo (no push), so don't persist the token in
          # .git/config — avoids credential leakage via the checkout (zizmor artipacked).
          persist-credentials: false

      - name: Install the pinned ARM cross C compiler (Ubuntu archive snapshot)
        env:
          # Immutable Ubuntu archive snapshot that pins ring's C/asm cross-gcc (issue #76).
          # This snapshot serves the exact toolchain the committed binary was built with:
          # gcc-13-arm-linux-gnueabihf 13.3.0-6ubuntu2~24.04.1cross1 (noble-updates).
          UBUNTU_SNAPSHOT: "20260601T000000Z"
        run: |
          set -euo pipefail
          # Use ONLY the frozen snapshot as apt's source, so the cross toolchain and its
          # entire dependency closure resolve against an immutable index — the produced
          # object code, and therefore the binary SHA-256, is reproducible across hosts and
          # over time. Remove the runner's rolling/third-party sources for this job (the
          # runner is ephemeral and we only need the cross gcc). echo-per-line (no leading
          # whitespace) so the deb822 field lines are valid.
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          {
            echo "Types: deb"
            echo "URIs: https://snapshot.ubuntu.com/ubuntu/${UBUNTU_SNAPSHOT}/"
            echo "Suites: noble noble-updates noble-security noble-backports"
            echo "Components: main restricted universe multiverse"
            echo "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg"
          } | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          # Snapshot Release files predate "now", so skip apt's Valid-Until freshness check.
          sudo apt-get -o Acquire::Check-Valid-Until=false update
          # Pin the toolchain to exact versions (--allow-downgrades in case the runner image
          # preinstalls a newer one). The transitive deps resolve from the same frozen
          # snapshot, so the whole closure is deterministic.
          sudo apt-get install -y --allow-downgrades \
            gcc-arm-linux-gnueabihf=4:13.2.0-7ubuntu1 \
            gcc-13-arm-linux-gnueabihf=13.3.0-6ubuntu2~24.04.1cross1 \
            cpp-13-arm-linux-gnueabihf=13.3.0-6ubuntu2~24.04.1cross1 \
            binutils-arm-linux-gnueabihf=2.42-4ubuntu2.10
          # Print the compiler version WITHOUT a pipeline (avoid SIGPIPE under pipefail).
          gcc_version="$(arm-linux-gnueabihf-gcc --version)"
          printf '%s\n' "${gcc_version%%$'\n'*}"

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          # Read the channel pinned by rust-toolchain.toml and install it explicitly BY NAME,
          # with its declared target + components. Installing by name (not a bare
          # `rustup toolchain install`, which is ambiguous, nor relying on the runner's
          # default or on auto-install) makes the toolchain deterministic (Copilot). The
          # cargo steps below run in native/btmqttd and select this channel via the
          # rust-toolchain.toml directory override.
          channel="$(grep -oP '^\s*channel\s*=\s*"\K[^"]+' native/btmqttd/rust-toolchain.toml || true)"
          if [ -z "$channel" ]; then
            echo "::error::could not read [toolchain] channel from native/btmqttd/rust-toolchain.toml" >&2
            exit 1
          fi
          echo "pinned channel: $channel"
          # Install both components rust-toolchain.toml declares (clippy + rustfmt) so
          # the CI toolchain matches the repo's pinned toolchain exactly and nothing is
          # implicitly downloaded on first use in the directory (Copilot). `--component`
          # takes a COMMA-separated list; a space-separated `--component clippy rustfmt`
          # would parse `rustfmt` as a toolchain name (not a component) and rustup errors out.
          rustup toolchain install "$channel" --profile minimal \
            --target armv7-unknown-linux-musleabihf \
            --component clippy,rustfmt
          rustup run "$channel" rustc --version

      - name: cargo test (host)
        working-directory: native/btmqttd
        run: cargo test --locked

      - name: cargo clippy
        working-directory: native/btmqttd
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Reproducible release cross-build
        working-directory: native/btmqttd
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-ar
        run: |
          # Scrub the runner's CARGO_HOME + workspace prefixes so the binary is
          # host-independent and its SHA-256 matches the locally built one (BUILD.md).
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS="-Clinker-flavor=ld.lld -Clink-self-contained=yes -Ctarget-feature=+crt-static --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$(pwd)=/build"
          cargo build --release --locked --target armv7-unknown-linux-musleabihf
          file target/armv7-unknown-linux-musleabihf/release/btmqttd

      - name: Verify binary provenance (metadata + reproduction, both FATAL)
        run: |
          # Fatal: committed binary == PayloadBinaries == THIRD_PARTY (deterministic).
          # Fatal: rebuilt binary == committed binary — enforceable now that every build
          # input is pinned (rustc, Cargo.lock, and ring's cross-gcc via the Ubuntu
          # snapshot above); a mismatch means the vendored binary is out of sync (#76).
          native/btmqttd/ci/verify-provenance.sh --rebuilt \
            native/btmqttd/target/armv7-unknown-linux-musleabihf/release/btmqttd
