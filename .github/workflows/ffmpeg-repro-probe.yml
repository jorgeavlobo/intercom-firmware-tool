name: ffmpeg reproducibility diagnostic (temp)

# TEMPORARY (issue #120): pin down the cross-run nondeterminism. Build TWICE at the SAME
# path (rm the tree between builds) with the zig cache CLEARED between builds — replicating
# two separate CI jobs as closely as possible — then always dump the byte-diff, ELF section
# map, and differing strings so we can see exactly what leaks in. Delete after use.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ffmpeg-repro-probe.yml'

permissions:
  contents: read

env:
  ZIG_VERSION: 0.13.0
  FFMPEG_TAG: n7.1.1
  ZIG_SHA256: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
  FFMPEG_TARBALL_SHA256: f117507dc501f2a6c11f9241d8d0c3213846cfad91764361af37befd6b6c523d

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Zig (pinned + SHA-256 verified)
        run: |
          set -euxo pipefail
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          [ "$(sha256sum zig.tar.xz | awk '{print $1}')" = "$ZIG_SHA256" ] || { echo "::error::zig sha"; exit 1; }
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Fetch + verify FFmpeg source
        run: |
          set -euxo pipefail
          curl -fsSL -o ffmpeg.tar.gz "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${FFMPEG_TAG}.tar.gz"
          [ "$(sha256sum ffmpeg.tar.gz | awk '{print $1}')" = "$FFMPEG_TARBALL_SHA256" ] || { echo "::error::ffmpeg sha"; exit 1; }

      - name: Build twice at the SAME path, zig cache cleared between; dump the diff
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y binutils
          build() {   # $1 = output copy name; always builds in ./ffmpeg-src (same path)
            rm -rf ffmpeg-src ~/.cache/zig
            mkdir ffmpeg-src
            tar -xzf ffmpeg.tar.gz -C ffmpeg-src --strip-components=1
            ( cd ffmpeg-src
              export SOURCE_DATE_EPOCH=1700000000
              ./configure \
                --cc="zig cc -target arm-linux-musleabihf -mcpu=generic+v7a+vfp3d16" \
                --ar="zig ar" --ranlib="zig ranlib" --nm="nm" --host-cc=cc \
                --enable-cross-compile --arch=arm --target-os=linux --pkg-config=false \
                --disable-everything --disable-autodetect --disable-doc --disable-debug \
                --disable-shared --enable-static --enable-small \
                --disable-programs --enable-ffmpeg --disable-asm --disable-stripping \
                --enable-protocol=file,udp,rtp,rtsp,tcp \
                --enable-demuxer=sdp,rtsp,rtp --enable-muxer=rtsp,rtp \
                --extra-cflags="-Os" --extra-ldflags="-static -s" >/dev/null
              make -j1 >/dev/null 2>&1 )
            cp ffmpeg-src/ffmpeg "$1"
          }
          build x
          build y
          sx="$(sha256sum x | awk '{print $1}')"; sy="$(sha256sum y | awk '{print $1}')"
          echo "PROBE X sha256=$sx size=$(stat -c %s x)"
          echo "PROBE Y sha256=$sy size=$(stat -c %s y)"
          if [ "$sx" = "$sy" ]; then
            echo "PROBE RESULT: REPRODUCIBLE at same path with cleared cache"; exit 0
          fi
          echo "PROBE RESULT: NOT REPRODUCIBLE — dumping diff"
          echo "=== differing byte count ==="; cmp -l x y | wc -l || true
          echo "=== first 60 differing offsets (dec, valA-oct, valB-oct) ==="; cmp -l x y | head -60 || true
          echo "=== section headers (map file offsets to sections) ==="; readelf -S x || true
          echo "=== notes / build-id ==="; readelf -n x || true
          echo "=== .comment ==="; readelf -p .comment x 2>/dev/null || true
          echo "=== string-set diff (first 40) ==="; diff <(strings x | sort) <(strings y | sort) | head -40 || true
          # Show a hexdump window around the first differing offset for context.
          off="$(cmp -l x y | head -1 | awk '{print $1}')"
          if [ -n "${off:-}" ]; then
            start=$(( off > 64 ? off - 64 : 0 ))
            echo "=== hexdump X around first diff (offset ~$off) ==="; dd if=x bs=1 skip="$start" count=160 2>/dev/null | xxd || true
            echo "=== hexdump Y around first diff ==="; dd if=y bs=1 skip="$start" count=160 2>/dev/null | xxd || true
          fi
