name: codeql

# CodeQL static analysis (SAST) for the C# code (App + Core). Free for public repos;
# results land in the repo's Security -> Code scanning tab. Uses the buildless C#
# analyzer (build-mode: none): no Windows/WPF build needed — which also sidesteps Core's
# mixed-mode native SharpExt4 reference — so this runs cheaply on Linux. Runs on PRs (the
# gate), pushes to master, a weekly schedule (catches newly-published query updates on
# unchanged code), and on demand.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC
  workflow_dispatch:

# Least-privilege default for the whole workflow; the analyze job below widens its own
# scope to security-events: write for the SARIF upload.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload SARIF results to the code-scanning API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:csharp"
