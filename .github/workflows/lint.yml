name: lint

# Static checks for the shell scripts shipped into the firmware image (the device
# service launcher + watchdog, POSIX sh) and the CI helper (bash), plus a lint of the
# GitHub Actions workflows themselves. Runs on Linux (free runner). Cheap and broad, so
# it runs on every PR to be a required check.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # Lint the GitHub Actions workflows themselves (runner labels, ${{ }} expressions,
    # and — via its bundled ShellCheck — the inline `run:` shell steps that the shell
    # job below does NOT cover). Pinned actionlint image for reproducibility.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Pinned by image DIGEST (immutable — a retag can't change what CI runs),
        # consistent with the SHA-pinned actions above. Dependabot does not track Docker
        # images used inside run: steps, so bump this by hand: resolve the new digest with
        # `docker buildx imagetools inspect rhysd/actionlint:<tag>` and update both below.
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check (dash -n / bash -n)
        run: |
          set -euo pipefail
          # Device scripts are #!/bin/sh — validate POSIX syntax with dash *explicitly*
          # (issue #14), so the dialect is stable regardless of what /bin/sh resolves to
          # on the runner. dash ships with ubuntu-24.04 (it is /bin/sh there).
          for f in \
            IntercomFirmwareTool.Core/Payload/mqtt/bt_service_watchdog \
            IntercomFirmwareTool.Core/Payload/mqtt/btmqttd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtcd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtc-net-hook; do
            echo "dash -n $f"; dash -n "$f"
          done
          # bash CI helper:
          echo "bash -n native/btmqttd/ci/verify-provenance.sh"
          bash -n native/btmqttd/ci/verify-provenance.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          # ShellCheck is preinstalled on the ubuntu runner image; it reads each file's
          # shebang to pick the sh/bash dialect automatically.
          shellcheck --version
          shellcheck \
            IntercomFirmwareTool.Core/Payload/mqtt/bt_service_watchdog \
            IntercomFirmwareTool.Core/Payload/mqtt/btmqttd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtcd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtc-net-hook \
            native/btmqttd/ci/verify-provenance.sh

  attributions:
    # Guard (issue #132): the AI-reviewer tool names must not appear ANYWHERE in the repo. They only
    # ever showed up as reviewer attributions in comments — comments should explain WHY, not WHO; the
    # reviewer that surfaced a rationale is not something a future maintainer needs (that provenance
    # lives in git history and the PR threads), and a frozen attribution just ages badly. Since the
    # names have no other legitimate use here, a plain whole-word text match is enough: this fails the
    # build if any of the three reappears as a whole word, case-insensitively, anywhere in the tree —
    # source AND config (including these workflows) — minus git internals, build outputs, and the
    # reviewer's own config file (which legitimately names the tool).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No reviewer attributions anywhere in the repo
        run: |
          set -uo pipefail
          # `git grep` searches TRACKED files (so untracked build outputs are skipped for free — no
          # need to list target/bin/obj): `-I` skips binaries (the vendored ARM binaries), `-w`
          # whole-word, `-i` case-insensitive (a lowercase spelling can't slip past). The two excludes
          # are EXACT-path pathspecs, so a same-named file elsewhere is still scanned: `.coderabbit.yaml`
          # (the reviewer's own config legitimately names the tool) and this workflow (which must
          # reference the names to describe and run the check).
          # git grep exit status: 0 = matches found, 1 = no matches, other = an ERROR. Capture it
          # explicitly and branch on all three — treating every nonzero status as "clean" would let a
          # scan error masquerade as a pass. GitHub runs `run:` steps with `bash -e`, so `set +e` here
          # is REQUIRED: without it the clean case (exit 1) would abort the step before we read the
          # status. Re-enable `-e` afterwards.
          set +e
          hits=$(git grep -IEnwi '(Codex|CodeRabbit|Copilot)' -- \
              ':!.coderabbit.yaml' ':!.github/workflows/lint.yml')
          status=$?
          set -e
          case "$status" in
            0)
              echo "$hits"
              echo "::error::AI-reviewer tool name(s) found in the repo (issue #132) — these only belong as attributions in comments, which should explain why, not who. Remove the name and reflow the sentence; the provenance already lives in git history and the PR thread."
              exit 1
              ;;
            1)
              echo "OK: no AI-reviewer attributions found."
              ;;
            *)
              echo "::error::attribution scan failed (git grep exit ${status}) — the guard could not verify the tree."
              exit "${status}"
              ;;
          esac
