name: lint

# Static checks for the shell scripts shipped into the firmware image (the device
# service launcher + watchdog, POSIX sh) and the CI helper (bash), plus a lint of the
# GitHub Actions workflows themselves. Runs on Linux (free runner). Cheap and broad, so
# it runs on every PR to be a required check.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # Lint the GitHub Actions workflows themselves (runner labels, ${{ }} expressions,
    # and — via its bundled ShellCheck — the inline `run:` shell steps that the shell
    # job below does NOT cover). Pinned actionlint image for reproducibility.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Pinned by image DIGEST (immutable — a retag can't change what CI runs),
        # consistent with the SHA-pinned actions above. Dependabot does not track Docker
        # images used inside run: steps, so bump this by hand: resolve the new digest with
        # `docker buildx imagetools inspect rhysd/actionlint:<tag>` and update both below.
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # 1.7.12

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check (dash -n / bash -n)
        run: |
          set -euo pipefail
          # Device scripts are #!/bin/sh — validate POSIX syntax with dash *explicitly*
          # (issue #14), so the dialect is stable regardless of what /bin/sh resolves to
          # on the runner. dash ships with ubuntu-24.04 (it is /bin/sh there).
          for f in \
            IntercomFirmwareTool.Core/Payload/mqtt/bt_service_watchdog \
            IntercomFirmwareTool.Core/Payload/mqtt/btmqttd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtcd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtc-net-hook; do
            echo "dash -n $f"; dash -n "$f"
          done
          # bash CI helper:
          echo "bash -n native/btmqttd/ci/verify-provenance.sh"
          bash -n native/btmqttd/ci/verify-provenance.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          # ShellCheck is preinstalled on the ubuntu runner image; it reads each file's
          # shebang to pick the sh/bash dialect automatically.
          shellcheck --version
          shellcheck \
            IntercomFirmwareTool.Core/Payload/mqtt/bt_service_watchdog \
            IntercomFirmwareTool.Core/Payload/mqtt/btmqttd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtcd \
            IntercomFirmwareTool.Core/Payload/mqtt/go2rtc-net-hook \
            native/btmqttd/ci/verify-provenance.sh

  attributions:
    # Guard (issue #132): AI-reviewer tool names must not appear in source comments. Comments
    # explain WHY, not WHO — the reviewer that surfaced a rationale is not something a future
    # maintainer needs; that provenance lives in git history (blame + commit messages) and the PR
    # threads, and a frozen `(Codex)` in source just ages badly. This fails the build if any of the
    # three names reappears as a whole word in the source trees. It scans ONLY those trees — not
    # `.github/` (so the pattern on the next line can't match this workflow itself) and not build
    # outputs — and skips the vendored binary.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No reviewer attributions in source comments
        run: |
          set -uo pipefail
          # grep exit status: 0 = matches found, 1 = no matches, >=2 = an ERROR (e.g. a scanned
          # path is missing or unreadable). Capture it explicitly and branch on all three — treating
          # every nonzero status as "clean" would let a scan error masquerade as a pass. GitHub runs
          # `run:` steps with `bash -e`, so `set +e` here is REQUIRED: without it the clean case
          # (grep exits 1, no matches) would abort the step before we can read the status. Re-enable
          # `-e` afterwards. --binary-files=without-match skips the vendored ARM binary; --exclude-dir
          # skips Rust (target) and .NET (bin/obj) build outputs.
          set +e
          hits=$(grep -rnwE '(Codex|CodeRabbit|Copilot)' \
              native IntercomFirmwareTool.Core IntercomFirmwareTool.Core.Tests IntercomFirmwareTool.App \
              --binary-files=without-match \
              --exclude-dir=target --exclude-dir=bin --exclude-dir=obj)
          status=$?
          set -e
          case "$status" in
            0)
              echo "$hits"
              echo "::error::AI-reviewer attribution(s) found in source comments (issue #132). Comments should explain why, not who — remove the tool name and reflow the sentence; the provenance already lives in git history and the PR thread."
              exit 1
              ;;
            1)
              echo "OK: no AI-reviewer attributions in source."
              ;;
            *)
              echo "::error::attribution scan failed (grep exit ${status}) — a scanned path may be missing or unreadable, so the guard could not verify the tree."
              exit 1
              ;;
          esac
