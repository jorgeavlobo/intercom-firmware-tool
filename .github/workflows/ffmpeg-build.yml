name: ffmpeg binary refresh (#120)

# Deliberate, dispatch-only refresh of the vendored minimal LGPL ffmpeg (issue #120).
# It builds the binary reproducibly from the pinned, SHA-256-verified FFmpeg source with
# the pinned, SHA-256-verified Zig, and commits the result (binary + LGPL text). The build
# is byte-reproducible (built outside the git worktree so FFmpeg's version isn't stamped
# with this repo's commit hash, and no absolute build path leaks in — see BUILD.md), so
# ffmpeg-provenance.yml can then rebuild and require a byte-for-byte match, exactly like
# btmqttd. Run this only when intentionally bumping the pins/recipe; after it commits,
# update PayloadBinaries.cs + THIRD_PARTY.md with the printed sha256 + size.

on:
  workflow_dispatch:

# This job COMMITS the rebuilt binary back to the branch, so it needs write access and the
# checkout token persisted for the push (unlike the read-only provenance job).
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.13.0
  FFMPEG_TAG: n7.1.1
  ZIG_SHA256: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
  FFMPEG_TARBALL_SHA256: f117507dc501f2a6c11f9241d8d0c3213846cfad91764361af37befd6b6c523d
  SOURCE_DATE_EPOCH: '1700000000'
  BIN: IntercomFirmwareTool.Core/Payload/vendor/armhf/ffmpeg
  LIC: IntercomFirmwareTool.Core/Payload/vendor/licenses/ffmpeg-COPYING.LGPLv2.1.txt
  # musl's own license: zig cc statically links musl libc objects into the binary, and
  # musl's MIT exception covers only headers/CRT — the linked libc.a objects still require
  # the notice. Sourced from the pinned zig distribution (which bundles musl).
  MUSL_LIC: IntercomFirmwareTool.Core/Payload/vendor/licenses/musl-COPYRIGHT.txt

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # persist-credentials left at its default (true): this job pushes the rebuilt
        # binary, so it needs the token in .git/config for `git push`.

      - name: Install Zig ${{ env.ZIG_VERSION }} (pinned + SHA-256 verified — no third-party action)
        run: |
          set -euxo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o zig.tar.xz "$url"
          got="$(sha256sum zig.tar.xz | awk '{print $1}')"
          if [ "$got" != "$ZIG_SHA256" ]; then
            echo "::error::zig tarball SHA-256 mismatch: got $got expected $ZIG_SHA256"; exit 1
          fi
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build the minimal LGPL ffmpeg from the pinned source
        run: |
          set -euxo pipefail
          curl -fsSL -o ffmpeg.tar.gz \
            "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${FFMPEG_TAG}.tar.gz"
          got="$(sha256sum ffmpeg.tar.gz | awk '{print $1}')"
          if [ "$got" != "$FFMPEG_TARBALL_SHA256" ]; then
            echo "::error::FFmpeg source SHA-256 mismatch: got $got expected $FFMPEG_TARBALL_SHA256"; exit 1
          fi
          # Build OUTSIDE the git worktree ($RUNNER_TEMP, not the checked-out repo). FFmpeg's
          # ffbuild/version.sh runs `git describe`, and if the source sits inside our repo's
          # worktree git walks up and stamps THIS repo's commit hash as the "ffmpeg version"
          # (the `ffmpeg version <hash>` banner) — which changes every commit and breaks the
          # byte-for-byte match. With no surrounding .git, the version is deterministic.
          rm -rf "$RUNNER_TEMP/ffmpeg-src"
          mkdir "$RUNNER_TEMP/ffmpeg-src"
          tar -xzf ffmpeg.tar.gz -C "$RUNNER_TEMP/ffmpeg-src" --strip-components=1
          cd "$RUNNER_TEMP/ffmpeg-src"
          # CFLAGS is just -Os: no -ffile-prefix-map, whose value would embed the absolute
          # build path into FFmpeg's `configuration:` string and break byte-reproducibility.
          # We strip (-s) + --disable-debug, so no DWARF comp_dir survives, and FFmpeg
          # compiles with relative __FILE__ paths — the output is path-independent.
          ./configure \
            --cc="zig cc -target arm-linux-musleabihf -mcpu=generic+v7a+vfp3d16" \
            --ar="zig ar" --ranlib="zig ranlib" --nm="nm" --host-cc=cc \
            --enable-cross-compile --arch=arm --target-os=linux --pkg-config=false \
            --disable-everything --disable-autodetect --disable-doc --disable-debug \
            --disable-shared --enable-static --enable-small \
            --disable-programs --enable-ffmpeg --disable-asm --disable-stripping \
            --enable-protocol=file,udp,rtp,rtsp,tcp \
            --enable-demuxer=sdp,rtsp,rtp --enable-muxer=rtsp,rtp \
            --extra-cflags="-Os" --extra-ldflags="-static -s"
          # -j1 (serial): FFmpeg's parallel build is NOT byte-reproducible across runs
          # (object/archive ordering depends on parallel completion order), which would
          # break the byte-for-byte provenance match. Serial build is deterministic. Keep
          # this identical to ffmpeg-provenance.yml.
          make -j1

      - name: Verify the rebuilt binary runs on armv7 + is LGPL
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          qemu-arm-static "$RUNNER_TEMP/ffmpeg-src/ffmpeg" -hide_banner -version | tee built.ver
          if grep -m1 'configuration:' built.ver | grep -Eq -- '--enable-(gpl|nonfree)'; then
            echo "::error::rebuilt ffmpeg is GPL/nonfree — must be LGPL"; exit 1
          fi

      - name: Vendor the binary + its LGPL text, update metadata, then commit atomically
        env:
          PB: IntercomFirmwareTool.Core/Payload/PayloadBinaries.cs
          TP: IntercomFirmwareTool.Core/Payload/vendor/THIRD_PARTY.md
        run: |
          set -euxo pipefail
          # cp over the already-tracked files preserves their committed mode (no spurious
          # mode change in the diff); both destination paths already exist in the tree.
          cp -f "$RUNNER_TEMP/ffmpeg-src/ffmpeg" "$BIN"
          cp -f "$RUNNER_TEMP/ffmpeg-src/COPYING.LGPLv2.1" "$LIC"
          # Vendor musl's license from the pinned zig distribution (bundles musl). The static
          # binary links musl libc objects, whose MIT notice is required (the musl exception
          # only waives headers/CRT). The same upstream musl license also covers btmqttd's
          # statically-linked musl, so this one notice is shared by both binaries.
          musl_copyright="$(find "$PWD/zig-linux-x86_64-${ZIG_VERSION}" -path '*/musl/COPYRIGHT' -print -quit)"
          [ -n "$musl_copyright" ] || { echo "::error::musl COPYRIGHT not found in the zig distribution"; exit 1; }
          cp -f "$musl_copyright" "$MUSL_LIC"
          FF_SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          FF_SIZE="$(stat -c '%s' "$BIN")"
          cs="$(printf '%s' "$FF_SIZE" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')"   # 2,024,448
          us="${cs//,/_}"                                                     # 2_024_448
          # Rewrite the recorded SHA-256 + size in BOTH metadata files IN THE SAME COMMIT, so
          # a refresh never leaves an inconsistent tree (PayloadBinaries.Read would otherwise
          # reject the new binary against a stale hash, and tests would fail, until a manual
          # follow-up — Codex). sed is range-scoped to ONLY the ffmpeg entries, so btmqttd's
          # metadata is never touched: PayloadBinaries.cs's Ffmpeg record (Name:"ffmpeg" → the
          # closing ');'), and THIRD_PARTY.md's ffmpeg table (armhf/ffmpeg → SPDX expression).
          sed -i "/Name: \"ffmpeg\"/,/);/{
            s/Length: [0-9_]*,/Length: ${us},/
            s/Sha256Hex: \"[0-9a-f]*\",/Sha256Hex: \"${FF_SHA}\",/
          }" "$PB"
          sed -i "\#armhf/ffmpeg#,/SPDX expression/{
            s/| Size | [0-9,]* bytes |/| Size | ${cs} bytes |/
            s/| SHA-256 | \`[0-9a-f]*\` |/| SHA-256 | \`${FF_SHA}\` |/
          }" "$TP"
          # Fail fast if the patch didn't land (e.g. the file layout changed).
          grep -q "Sha256Hex: \"${FF_SHA}\"" "$PB" || { echo "::error::PayloadBinaries.cs sha not updated"; exit 1; }
          grep -q "\`${FF_SHA}\`" "$TP"            || { echo "::error::THIRD_PARTY.md sha not updated"; exit 1; }
          echo "metadata updated: sha256=${FF_SHA} size=${FF_SIZE} (${us})"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BIN" "$LIC" "$MUSL_LIC" "$PB" "$TP"
          if git diff --cached --quiet; then
            echo "no change to the vendored ffmpeg — nothing to commit"; exit 0
          fi
          git commit -m "#120 Phase 1a: refresh vendored ffmpeg (sha256=${FF_SHA}, ${FF_SIZE} bytes) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
