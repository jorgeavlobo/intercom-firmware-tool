name: update manifest

# When a GitHub Release is PUBLISHED (a human clicks Publish on the #79 draft), bump
# 'latestVersion' in .well-known/updates.json — the manifest the in-app startup update check
# (#85) reads — to the released tag, so users get nudged to it. Prereleases are skipped (the
# nudge ignores them). 'minimumSupportedVersion' is NEVER touched here; it is maintained by hand,
# only to retroactively flag an old build unsafe.
#
# The default branch requires changes to go through a pull request (branch ruleset), so this job
# does NOT push to it directly. Instead it commits the one-line bump to a short-lived branch, opens
# a PR, and turns on auto-merge — the PR merges itself once the required checks pass.
#
# GitHub gotcha: a PR opened with the built-in GITHUB_TOKEN does NOT trigger the `pull_request`
# status checks (anti-recursion), so auto-merge would wait forever for checks that never start. To
# make the flow fully autonomous, add a fine-grained PAT as the `MANIFEST_PAT` secret (Contents:
# Read/Write, Pull requests: Read/Write); the job uses it when present so the checks run and the PR
# auto-merges. WITHOUT the PAT the job still opens the PR (best effort) and a maintainer merges it.
# Either way nothing breaks if it doesn't land: a stale 'latestVersion' just means no update nudge
# (fail-safe), and a maintainer can bump the one line by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to set as latestVersion (e.g. 1.2.3)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # This job commits the bump to a side branch and opens a PR, so it needs the token
          # persisted for `git push` of that branch. Prefer the PAT (so the PR's required checks
          # run and auto-merge can complete); fall back to GITHUB_TOKEN.
          token: ${{ secrets.MANIFEST_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          # Full history: keep it robust against an advanced master.
          fetch-depth: 0

      - name: Bump latestVersion in the update manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.MANIFEST_PAT || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.MANIFEST_PAT != '' }}
        run: |
          set -euo pipefail

          # Resolve the target version: the manual dispatch input, else the published release tag
          # (strip a leading 'v'). Publishing a PRERELEASE never bumps latestVersion — the nudge
          # deliberately ignores prereleases.
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            if [ "${PRERELEASE:-}" = "true" ]; then
              echo "Prerelease ${TAG:-} — the update nudge ignores prereleases; not bumping."
              exit 0
            fi
            version="${TAG#v}"
          fi

          # Reject any control/non-printable character (newline, tab, …) FIRST: grep matches line
          # by line, so a multiline workflow_dispatch input like "1.2.3<newline>junk" would pass the
          # format check on its first line and then be written whole into the manifest — an
          # unparseable latestVersion that fails the app open (no nudge, no block). Same hardening
          # the release workflow applies to its version input.
          case "$version" in
            *[![:print:]]*)
              echo "::error::version contains control or non-printable characters; not bumping."
              exit 1 ;;
          esac

          # Drop any SemVer build metadata: a tag like v1.2.3+meta is a stable release the release
          # workflow accepts, and the app's SemanticVersion ignores build metadata for precedence —
          # so normalise to the plain X.Y.Z we compare and store. (Without this the format check
          # below would reject '1.2.3+meta' and the manifest would stay stale.)
          version="${version%%+*}"

          # Only auto-bump to a stable X.Y.Z (no prerelease/build suffix, and no leading zeros in
          # any component — SemanticVersion.TryParse rejects '01.2.3', so accepting it here would
          # write a value the app can't parse and silently fail open).
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$version' is not a stable X.Y.Z version (no leading zeros); not bumping."
            exit 1
          fi

          file=.well-known/updates.json

          # Never move latestVersion BACKWARDS, and never break the invariant the in-app block
          # relies on (minimumSupportedVersion <= latestVersion) — either would silently disable
          # the unsafe-version block. A backport release (e.g. 1.2.4 after 1.3.0) or a stale
          # dispatch input would otherwise regress it. sort -V handles the stable X.Y.Z values this
          # step accepts; sort_le "$a" "$b" is true when a <= b.
          sort_le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          current="$(jq -r '.latestVersion // "0.0.0"' "$file")"
          minimum="$(jq -r '.minimumSupportedVersion // "0.0.0"' "$file")"
          if ! sort_le "$current" "$version"; then
            echo "::error::'$version' is older than the current latestVersion '$current'; not bumping."
            exit 1
          fi
          if ! sort_le "$minimum" "$version"; then
            echo "::error::'$version' is below minimumSupportedVersion '$minimum'; not bumping."
            exit 1
          fi

          tmp="$(mktemp)"
          jq --arg v "$version" '.latestVersion = $v' "$file" > "$tmp"
          mv "$tmp" "$file"

          if git diff --quiet -- "$file"; then
            echo "latestVersion already $version — nothing to do."
            exit 0
          fi

          # The default branch requires a PR, so commit to a short-lived branch and open one rather
          # than pushing to master. Branch name is version-scoped so re-runs update the same PR.
          branch="chore/update-manifest-$version"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$file"
          git commit -m "chore(updates): set latestVersion to $version"
          # Force-push the side branch (safe: it is a throwaway, never the protected master) so a
          # re-run after a failed check refreshes it in place.
          git push --force origin "HEAD:$branch"

          # Open the PR if one isn't already open for this branch (idempotent across re-runs).
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' 2>/dev/null)" ]; then
            gh pr create --base master --head "$branch" \
              --title "chore(updates): set latestVersion to $version" \
              --body "Automated update of \`.well-known/updates.json\` \`latestVersion\` to \`$version\` after the v$version release was published (issue #85). Merging this makes the in-app update check nudge users to v$version." \
              || echo "::warning::could not open the PR automatically — open it by hand for branch $branch"
          else
            echo "A PR for $branch is already open — it was updated in place."
          fi

          # Turn on auto-merge so the PR lands on its own once the required checks pass. This only
          # completes when the checks actually RUN, which needs the PAT (a GITHUB_TOKEN PR doesn't
          # trigger them). Without the PAT, leave the PR for a maintainer to merge.
          if [ "${HAVE_PAT:-false}" = "true" ]; then
            gh pr merge "$branch" --auto --squash \
              || echo "::warning::could not enable auto-merge (is 'Allow auto-merge' enabled in repo settings?) — merge the PR by hand."
            echo "Opened PR to set latestVersion=$version and requested auto-merge."
          else
            echo "::warning::MANIFEST_PAT secret is not set — the PR's required checks won't start under GITHUB_TOKEN, so auto-merge can't complete. A maintainer should merge the PR for branch $branch to set latestVersion=$version."
          fi
