name: update manifest

# When a GitHub Release is PUBLISHED (a human clicks Publish on the #79 draft), bump
# 'latestVersion' in .well-known/updates.json — the manifest the in-app startup update check
# (#85) reads — to the released tag, so users get nudged to it. Prereleases are skipped (the
# nudge ignores them). 'minimumSupportedVersion' is NEVER touched here; it is maintained by hand,
# only to retroactively flag an old build unsafe.
#
# The default branch requires changes to go through a pull request (branch ruleset), so this job
# does NOT push to it directly. Instead it commits the one-line bump to a single rolling side branch
# ('chore/update-manifest', reused across releases so a still-pending bump doesn't spawn a competing
# PR), opens a PR, and turns on auto-merge — the PR merges itself once the required checks pass.
#
# GitHub gotcha: a PR opened with the built-in GITHUB_TOKEN does NOT trigger the `pull_request`
# status checks (anti-recursion), so auto-merge would wait forever for checks that never start. To
# make the flow fully autonomous, add a fine-grained PAT as the `MANIFEST_PAT` secret (Contents:
# Read/Write, Pull requests: Read/Write); the job uses it when present so the checks run and the PR
# auto-merges. WITHOUT the PAT the job still opens the PR (best effort), but its required checks
# never start, so a maintainer must first retrigger them with a human-authored event (close/reopen
# the PR, or push with a personal token) and then merge. Either way nothing breaks if it doesn't
# land: a stale 'latestVersion' just means no update nudge (fail-safe), and a maintainer can bump
# the one line by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to set as latestVersion (e.g. 1.2.3)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # This job commits the bump to a side branch and opens a PR, so it needs the token
          # persisted for `git push` of that branch. Prefer the PAT (so the PR's required checks
          # run and auto-merge can complete); fall back to GITHUB_TOKEN.
          token: ${{ secrets.MANIFEST_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          # Full history: keep it robust against an advanced master.
          fetch-depth: 0

      - name: Bump latestVersion in the update manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.MANIFEST_PAT || secrets.GITHUB_TOKEN }}
          HAVE_PAT: ${{ secrets.MANIFEST_PAT != '' }}
        run: |
          set -euo pipefail

          # Resolve the target version: the manual dispatch input, else the published release tag
          # (strip a leading 'v'). Publishing a PRERELEASE never bumps latestVersion — the nudge
          # deliberately ignores prereleases.
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            if [ "${PRERELEASE:-}" = "true" ]; then
              echo "Prerelease ${TAG:-} — the update nudge ignores prereleases; not bumping."
              exit 0
            fi
            version="${TAG#v}"
          fi

          # Reject any control/non-printable character (newline, tab, …) FIRST: grep matches line
          # by line, so a multiline workflow_dispatch input like "1.2.3<newline>junk" would pass the
          # format check on its first line and then be written whole into the manifest — an
          # unparseable latestVersion that fails the app open (no nudge, no block). Same hardening
          # the release workflow applies to its version input.
          case "$version" in
            *[![:print:]]*)
              echo "::error::version contains control or non-printable characters; not bumping."
              exit 1 ;;
          esac

          # Drop any SemVer build metadata: a tag like v1.2.3+meta is a stable release the release
          # workflow accepts, and the app's SemanticVersion ignores build metadata for precedence —
          # so normalise to the plain X.Y.Z we compare and store. (Without this the format check
          # below would reject '1.2.3+meta' and the manifest would stay stale.)
          version="${version%%+*}"

          # Only auto-bump to a stable X.Y.Z (no prerelease/build suffix, and no leading zeros in
          # any component — SemanticVersion.TryParse rejects '01.2.3', so accepting it here would
          # write a value the app can't parse and silently fail open).
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$version' is not a stable X.Y.Z version (no leading zeros); not bumping."
            exit 1
          fi

          file=.well-known/updates.json
          branch="chore/update-manifest"

          # The default branch requires a PR, so the bump goes onto ONE fixed rolling side branch
          # (reused across releases so a still-pending bump never spawns a second, conflicting PR),
          # opened as a PR and auto-merged. Root that branch on a FRESHLY fetched master, not the
          # possibly-stale initial checkout: if the previous manifest PR merged mid-run, this keeps the
          # new commit from rooting on a pre-merge base that would then conflict (Codex).
          git fetch origin master
          git checkout -B "$branch" origin/master

          # sort_le a b  ->  true when a <= b (sort -V handles the stable X.Y.Z values this step accepts).
          sort_le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          # Resolve the open rolling PR number from THIS repo (prints empty when none). Centralised so the
          # same-repo + base-master + open-state filter can never drift between call sites (CodeRabbit).
          resolve_pr() {
            gh pr list --head "$branch" --base master --state open --json number,isCrossRepository \
              --jq 'map(select(.isCrossRepository == false)) | .[0].number // empty'
          }
          master_latest="$(jq -r '.latestVersion // "0.0.0"' "$file")"
          minimum="$(jq -r '.minimumSupportedVersion // "0.0.0"' "$file")"

          # Is a PR already open on the rolling branch, from THIS repo? `gh pr list --head` filters by
          # branch NAME only, so on a public repo it could match a fork's same-named branch; select
          # isCrossRepository == false and use the verified number for edit/merge (Codex P1). Fail
          # CLOSED if the query itself errors (transient API/auth): treating a failed lookup as "no PR"
          # would skip the pending-version guard below and could force a lower version over a higher
          # pending one, so abort instead (Codex P2). An empty result (no such PR) is fine and proceeds.
          if ! existing="$(resolve_pr 2>/dev/null)"; then
            echo "::error::could not query the open rolling manifest PR; aborting rather than risk regressing a higher pending version."
            exit 1
          fi

          # Fetch the rolling branch (for the lease below, and to read its pending value). The
          # EFFECTIVE current latestVersion is the max of what's on master AND any value carried on the
          # rolling branch, so a lower backport/dispatch never regresses a higher version already queued
          # to merge (Codex P2). Read the branch value WHENEVER the branch exists, not only when an open
          # PR does: if a prior run's `gh pr create` failed, the branch is orphaned (no PR) but may hold
          # a NEWER version, and ignoring it would let a later lower bump overwrite and lose it (Codex).
          # A stale, already-merged branch just carries an old value <= master, so honoring it is safe.
          # Distinguish a genuinely-absent branch from a fetch that FAILED: if the branch exists on the
          # remote but the fetch errors (transient network/auth), fail closed. Otherwise pending_latest
          # would fall back to 0.0.0 (regressing a higher queued version) and the force-with-lease below
          # would push without a fresh lease (CodeRabbit). A branch that simply doesn't exist is fine.
          # `git ls-remote --exit-code` returns 2 when the branch genuinely does not exist, but other
          # nonzero codes (e.g. 128) when the query itself fails. Only exit 2 means "absent, skip the
          # fetch"; any other failure must fail closed, or we'd re-mask a transient error and leave
          # pending_latest at 0.0.0 / push without a fresh lease (CodeRabbit).
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if ! git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "::error::could not fetch the existing rolling branch '$branch'; aborting rather than risk regressing a higher pending version or pushing without a fresh lease."
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::could not determine whether rolling branch '$branch' exists (git ls-remote exit $status); aborting rather than risk regressing a higher pending version."
              exit 1
            fi
          fi
          pending_latest="0.0.0"
          if git rev-parse -q --verify "origin/$branch" >/dev/null 2>&1; then
            pending_latest="$(git show "origin/$branch:$file" 2>/dev/null | jq -r '.latestVersion // "0.0.0"' 2>/dev/null || echo '0.0.0')"
          fi
          # The value master should end up at is the newest of: this release, master's current value,
          # and whatever the rolling branch already carries (including an orphaned bump from a failed
          # prior `gh pr create`). Framing it as this max resolves BOTH failure modes: a lower backport
          # can't regress a higher pending/orphaned value, AND an orphaned higher value is recovered
          # (opened as a PR) instead of being skipped as "nothing to do" while master stays stale
          # (Codex). If master is already at that max, there is genuinely nothing to do.
          target="$version"
          if ! sort_le "$master_latest" "$target"; then target="$master_latest"; fi
          if ! sort_le "$pending_latest" "$target"; then target="$pending_latest"; fi

          if [ "$target" = "$master_latest" ]; then
            echo "master already at the newest latestVersion '$master_latest' (release '$version', rolling branch '$pending_latest'); nothing to do."
            exit 0
          fi
          # Keep the invariant the in-app unsafe-version block relies on (minimum <= latest).
          if ! sort_le "$minimum" "$target"; then
            echo "::error::target '$target' is below minimumSupportedVersion '$minimum'; not bumping."
            exit 1
          fi
          # From here on, operate on the resolved target (commit message, PR title, and the write below).
          version="$target"

          tmp="$(mktemp)"
          jq --arg v "$version" '.latestVersion = $v' "$file" > "$tmp"
          mv "$tmp" "$file"
          if git diff --quiet -- "$file"; then
            echo "latestVersion already $version; nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore(updates): set latestVersion to $version"
          # Push the rolling branch (a side branch, never the protected master). --force-with-lease
          # against the remote ref fetched above: refresh in place, but don't clobber an unexpected
          # update (Copilot).
          git push --force-with-lease origin "HEAD:$branch"

          title="chore(updates): set latestVersion to $version"
          body="Automated update of \`.well-known/updates.json\` \`latestVersion\` to \`$version\` after the v$version release was published (issue #85). Merging this makes the in-app update check nudge users to v$version."
          # Re-resolve the open rolling PR AFTER pushing: the create-vs-reuse decision must reflect the
          # PR's state now, not the pre-guard snapshot. The prior PR may have merged/closed in between,
          # which would otherwise make us edit a now-closed PR and never open a replacement (Codex).
          # Non-fatal: both branches below tolerate a wrong guess (create errors if one exists; edit
          # errors if none), so a transient failure just falls through to the create path.
          existing="$(resolve_pr 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh pr create --base master --head "$branch" --title "$title" --body "$body" \
              || echo "::warning::could not open the PR automatically; open it by hand for branch $branch"
            # Resolve the number we just created (same-repo filter) for the auto-merge step below.
            # Non-fatal here: a miss only means auto-merge isn't enabled (a maintainer can merge).
            existing="$(resolve_pr 2>/dev/null || true)"
          else
            # A PR is already open on the rolling branch; the force-push retargeted it to $version, so
            # refresh its title/body to match. If the edit FAILS (e.g. the PR closed in the narrow race
            # between the lookup above and here), re-resolve and fall back to creating a replacement, so
            # the pushed bump never ends up stranded on a branch with no open PR (CodeRabbit).
            if gh pr edit "$existing" --title "$title" --body "$body"; then
              echo "Reused open PR #$existing on $branch, retargeted to $version."
            else
              echo "::warning::could not edit PR #$existing (it may have closed); re-resolving and creating a replacement if needed."
              existing="$(resolve_pr 2>/dev/null || true)"
              if [ -z "$existing" ]; then
                gh pr create --base master --head "$branch" --title "$title" --body "$body" \
                  || echo "::warning::could not open a replacement PR automatically; open it by hand for branch $branch"
                existing="$(resolve_pr 2>/dev/null || true)"
              fi
            fi
          fi

          # Turn on auto-merge so the PR lands once the required checks pass, targeting the verified PR
          # NUMBER (never the ambiguous branch selector) (Codex P1). This only completes when the
          # checks actually RUN, which needs the PAT (a GITHUB_TOKEN PR doesn't trigger them).
          if [ "${HAVE_PAT:-false}" = "true" ]; then
            if [ -n "$existing" ]; then
              gh pr merge "$existing" --auto --squash \
                || echo "::warning::could not enable auto-merge on PR #$existing (is 'Allow auto-merge' enabled in repo settings?); merge it by hand."
              echo "Manifest PR #$existing set to latestVersion=$version, auto-merge requested."
            else
              echo "::warning::could not resolve the manifest PR number; enable auto-merge or merge it by hand."
            fi
          else
            # No PAT: the PR exists but its required status checks will NOT start, because GitHub
            # suppresses workflow runs for pull_request events created with GITHUB_TOKEN. With the
            # master ruleset requiring those checks, a maintainer cannot just click merge; the checks
            # must first be retriggered by a HUMAN-authored event.
            echo "::warning::MANIFEST_PAT is not set, so the PR opened for '$branch' has NO required status checks running (GitHub suppresses pull_request runs triggered by GITHUB_TOKEN). To land it, a maintainer must retrigger the checks with a human-authored event (close then reopen the PR, or push a commit to '$branch' with a personal token) and then merge. Alternatively, just set .well-known/updates.json latestVersion to $version by hand. Set the MANIFEST_PAT secret (plus enable 'Allow auto-merge') to make this fully automatic."
          fi
