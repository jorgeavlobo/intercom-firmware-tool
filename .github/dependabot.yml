version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. The workflows pin actions to commit
  # SHAs (supply-chain hardening); Dependabot opens a PR when a newer release exists,
  # updating the SHA and the trailing "# vX.Y.Z" comment so pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
    labels:
      - dependencies
      - github-actions
    # The CodeQL action ships init/ and analyze/ as sub-actions that must move in
    # lockstep: `analyze` fails with a "configuration error" if its version differs
    # from the `init` in the same run. Ungrouped, Dependabot opens one PR per
    # sub-action, so each PR bumps only half the pair and breaks the analyze job.
    # Grouping every codeql-action bump into a single PR keeps the pair in sync.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
